name: Reset playlists

on:
  schedule:
    # GitHub's `schedule` trigger has no timing guarantee -- observed delay
    # on this repo has been a consistent ~5h29m (07:00 UTC scheduled -> 12:29
    # UTC / 8:29am EDT actual, twice in a row). Scheduling earlier, at a
    # non-round minute (avoids the queueing pile-up that happens at exact
    # hour/half-hour marks), to land comfortably before 7am EDT when
    # Christian starts listening. If the delay pattern changes, this needs
    # re-tuning -- check actual run times in the Actions tab.
    - cron: "17 4 * * *"
  workflow_dispatch: {}

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python main.py --live
        env:
          SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
          SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
          SPOTIPY_REFRESH_TOKEN: ${{ secrets.SPOTIPY_REFRESH_TOKEN }}
